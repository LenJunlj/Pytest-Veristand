# 台架配置 —— 所有环境相关的东西只改这里，不改代码
# 也可以用环境变量 HIL_BENCH_CONFIG 指向另一份配置（多台架时用）

veristand:
  gateway: "localhost"        # 远程 Gateway 支持待验证（P1 清单项），当前按台架本机运行
  # 默认系统定义（跑仓库 tests/ 框架级用例时用）；
  # 跑 projects/<项目ID>/ 时会被该目录 project.yaml 的 veristand 段覆盖（多项目各指各的 .nivssdf）
  system_definition: "E:/P2546/Veristand项目/p2546.nivssdf"
  mode: "attach"              # attach=附加到已部署系统（安全默认，白天人工用）
                              # deploy=完整部署（CI 夜间回归用）
  deploy_timeout_ms: 120000
  channel_prefix: "Aliases/"
  model_target: "Controller"   # 模型所在目标名（ModelManager 参数 API 用，如 Controller）
  # 每个用例前后强制复位的安全状态（function 级 fixture 两侧都会执行，防状态泄漏）
  # 复位分三级合并（docs/通道分层方案.md §5，后者覆盖前者）：
  #   本段 = 台架级安全值（跨项目通用）→ project.yaml 的 veristand.reset_channels（可选）
  #   → module.yaml 的 reset 段（模块激励复位，见 left_heating/module.yaml）
  # 本段只放电源/继电器/点火台架安全态（值与 Stimulus.bench_shutdown 一致：
  # 冗余但无害，且保护未写 shutdown 的新项目）。模型前缀段随项目 model_name（双项目同名 TongYu_IO）。
  # HIL 安全确认 2026-11-06 已通过
  reset_channels:
    'Targets\Controller\Simulation Models\Models\TongYu_IO\Parameters\IO\PowerControl\VlotageControl\Value': 13.5   # 程控电源回标称电压
    'Targets\Controller\Simulation Models\Models\TongYu_IO\Parameters\IO\PowerControl\CurrentControl\Value': 20.0    # 量程电流
    'Targets\Controller\Simulation Models\Models\TongYu_IO\Parameters\IO\PowerControl\ON//OFF/Value': 1.0             # 电源开
    'Targets\Controller\Simulation Models\Models\TongYu_IO\Parameters\IO\PowerControl\Power_Relay\Value': 0.0         # 继电器断
    'Targets\Controller\Simulation Models\Models\TongYu_IO\Parameters\IO\PowerControl\IGN\Value': 0.0                 # 点火断

lock:
  path: "C:/HIL/bench.lock"   # 台架全局锁文件：本机所有使用者 + CI 必须指向同一个文件
  stale_after_s: 43200        # 超过 12h 视为陈锁，自动清理（防死锁）
  on_busy: "fail"             # fail=拿不到锁直接失败 / skip=跳过 hil 用例（CI 可选）

report:
  # Allure：未传 --alluredir 时（如 PyCharm 右键运行）也自动启用；--no-allure 可关闭
  allure:
    enabled: true
    results_dir: "allure-results"                   # 原始结果目录（每次运行前自动清空）
    bin: "C:/Tools/allure-2.29.0/bin/allure.bat"   # Allure CLI（Maven Central 下载，需 Java）
    java_home: "C:/Tools/jdk-17.0.2"                # 未设置系统 JAVA_HOME 时用这个
    outdir: "allure-report"                          # 相对仓库根

  # 报告版本管理：每次 pytest 结束把本轮的 allure-results / junit.xml 整份留档。
  # 不做的话下一轮开始会清空 allure-results、覆盖 allure-report —— 历史是被删除，不只是覆盖。
  # 留档在 .gitignore 内的 reports/ 下；回看/导出/删除见 docs/报告中心.md
  history:
    enabled: true
    dir: "reports/report_history"   # 相对仓库根
    keep: 50                        # 每项目保留的全量运行份数（不可再生的历史本体，约 1MB/份）
    debug_keep: 5                   # 调试运行（带 ::用例 / -k / --lf）单独保留份数，不挤占 keep
    max_generated: 3                # 每项目最多缓存几份现渲染的 Allure 站点（可再生，删了自动重建）

  # 报告中心页面上的「运行」按钮：后台起 pytest 子进程（任务目录 reports/run_jobs）
  runner:
    python: ""        # 留空=自动（pythonw 起的服务会自动换成同目录的 python.exe）
    keep_jobs: 20     # 保留最近多少个运行任务目录（含日志；含 slow 的一轮可达几十 MB）

  # 报告中心对局域网的入口（末尾不带斜杠）。写进 executor.json 的 Build 链接与群通知里：
  # 报告离开这台机器后别人点开也能回到这个版本 —— 千万别写 localhost（那是对方自己的机器）。
  public_url: "http://10.10.3.88:8899"

  # 访问日志（排查"页面反复刷新/谁在打接口"用）：填路径即开启，置空/false 关闭。
  # 默认关闭；开启后逐请求写一行（时间/来源 IP/请求行），超过 4MB 自动截半。
  access_log: "reports/report_access.log"

  # 跑完推群（企业微信/钉钉机器人）。默认关闭：没填 webhook 不会发任何请求。
  # 通知失败只打印一行，绝不影响测试结果与退出码。
  notify:
    enabled: false
    kind: wecom          # wecom=企业微信 / dingtalk=钉钉 / json=自定义 webhook
    webhook: ""          # 群机器人地址（含 key），属台架本地配置，别提交
    mention_all: false   # 钉钉是否 @所有人

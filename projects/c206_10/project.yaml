# c206_10 —— 项目级配置(一个项目 = 一套 VeriStand 工程,下含多个 .seq 模块)
# 目录名规范成合法 Python 包名(C206-10环境控制器 → c206_10),原名见 name。
# 台架级配置(Gateway、锁、Allure)在仓库根 config/bench.yaml,本文件的 veristand 段会覆盖它。

id: c206_10
name: C206-10环境控制器
epic: C206-10 环境控制器 HIL 测试

# 覆盖 config/bench.yaml 的 veristand 段(多项目各自指向自己的 .nivssdf)
veristand:
  system_definition: "E:/C206-10项目/Veristand项目/C026-10.nivssdf"   # 2026-11-07 用户提供(sdf 内 Root 名=C026-10,与目录名 c206_10 的 206/026 差异待用户确认正式名)
  model_target: "Controller"        # 模型所在目标名(ModelManager 参数 API 用;已验证与新 sdf 一致)

# 模块清单(= 一个 .seq / 一个被测功能);待 dump 存量 .seq 后登记
modules: []
